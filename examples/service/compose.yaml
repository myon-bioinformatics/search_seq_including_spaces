services:
  sequence:
    build:
      context: ../..
      dockerfile: examples/service/Dockerfile
    ports:
      - "127.0.0.1:8765:8765"
    healthcheck:
      test: ["CMD", "python", "-S", "-c", "import socket; socket.create_connection(('127.0.0.1', 8765), timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 6
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
