name: Tests

# Keep stdlib runtime isolation separate from test-only pytest tooling.
# CodeQL is intentionally not used: behavior gates run pytest/unittest, with
# pinned cross-repository xprobe observations and shared JUnit identity evidence.
# See docs/pytest-observations.md for their distinct contracts.

on:
  pull_request:
    paths:
      - "**.py"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "vendor.lock.json"
      - "vendor/**"
      - ".gitattributes"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "**.py"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "vendor.lock.json"
      - "vendor/**"
      - ".gitattributes"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Explicit bash runs steps with `-eo pipefail`; the implicit default does not.
    shell: bash

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vendor-lock:
    name: Verify vendor lock
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 2192ff22acafdd09e80ac722df91ee937aaedd5e
          path: .vendor-sync-tools
          persist-credentials: false
          sparse-checkout: |
            vendor_sync.py

      - name: Verify vendored bytes against lock
        run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json

  unittest:
    name: unittest (Python ${{ matrix.python-version }}, stdlib only)
    needs: vendor-lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Minimum supported version and the current stable release.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      # On pull_request events GITHUB_SHA is the test merge commit; also
      # report the branch head so results map to the pushed commit.
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python version and commit
        run: |
          python -S -c 'import platform, sys; print(f"python {platform.python_version()} ({sys.executable})")'
          echo "head commit ${HEAD_SHA}"
          echo "tested commit ${GITHUB_SHA}"

      - name: Check that no bytecode files are tracked
        run: |
          tracked="$(git ls-files -- '*.pyc' '*.pyo' '__pycache__/*' '*/__pycache__/*')"
          if [ -n "${tracked}" ]; then
            echo "::error title=Tracked bytecode::Compiled Python files are committed:"
            echo "${tracked}"
            exit 1
          fi
          echo "No compiled Python files are tracked."

      - name: Run unit tests without site-packages (python -S)
        run: |
          pyver="$(python -S -c 'import platform; print(platform.python_version())')"
          where="Python ${pyver}, head ${HEAD_SHA:0:12}, tested ${GITHUB_SHA:0:12}"
          if [ ! -d tests ]; then
            echo "::notice title=No tests::No tests/ directory on this ref; nothing to run (${where})."
            echo "none" > "${RUNNER_TEMP}/tests-ran"
            exit 0
          fi
          set -o pipefail
          status=0
          python -S -m unittest discover -s tests -v 2>&1 | tee "${RUNNER_TEMP}/unittest.log" || status=$?
          count="$(sed -n 's/^Ran \([0-9][0-9]*\) tests\{0,1\} in .*/\1/p' "${RUNNER_TEMP}/unittest.log")"
          echo "${count:-0}" > "${RUNNER_TEMP}/tests-ran"
          if [ "${count:-0}" -eq 0 ]; then
            echo "::error title=No tests ran::tests/ exists but unittest ran 0 tests (${where})."
            exit 1
          fi
          if [ "${status}" -ne 0 ]; then
            echo "::error title=Unit tests failed::unittest exited with status ${status} after ${count} tests (${where}); see the log above."
            exit "${status}"
          fi
          echo "::notice title=Tests passed::${count} tests passed (${where})."

      - name: Write job summary
        if: always()
        run: |
          ran="$(cat "${RUNNER_TEMP}/tests-ran" 2>/dev/null || echo "not reached")"
          {
            echo "### unittest (Python ${{ matrix.python-version }})"
            echo ""
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| Python | $(python -S -c 'import platform; print(platform.python_version())') |"
            echo "| Head commit | \`${HEAD_SHA}\` |"
            echo "| Tested commit | \`${GITHUB_SHA}\` |"
            echo "| Tests ran | ${ran} |"
            echo "| Command | \`python -S -m unittest discover -s tests\` |"
          } >> "${GITHUB_STEP_SUMMARY}"


      - name: Install test-only dependencies
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.3"
      - name: Sync locked development environment
        shell: bash
        run: |
          uv sync --locked --python "$(python -c 'import sys; print(sys.executable)')"
          python -c "import os; from pathlib import Path; print(Path('.venv').resolve() / ('Scripts' if os.name == 'nt' else 'bin'))" >> "$GITHUB_PATH"
      - name: Record native pytest outcomes and JUnit
        run: python -m pytest tests -p vendor.xprobe_pytest --xprobe-jsonl=reports/pytest-events.jsonl --xprobe-repository=myon-bioinformatics/search_seq_including_spaces --junitxml=reports/pytest-${{ matrix.python-version }}.xml
      - name: Preserve native observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-events-py${{ matrix.python-version }}
          path: reports/pytest-events.jsonl
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve raw JUnit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-py${{ matrix.python-version }}
          path: reports/pytest-${{ matrix.python-version }}.xml
          if-no-files-found: warn
          retention-days: 14

  failure-identity:
    needs: unittest
    if: always()
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@2192ff22acafdd09e80ac722df91ee937aaedd5e
    with:
      commit-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      expected-reports: '["junit-py3.11/pytest-3.11.xml","junit-py3.12/pytest-3.12.xml","junit-py3.13/pytest-3.13.xml","junit-py3.14/pytest-3.14.xml"]'
      artifact-pattern: "junit-py*"
      output-artifact: "failure-identity"
