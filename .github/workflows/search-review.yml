name: Local search review
on:
  workflow_dispatch:
  pull_request:
    paths:
      - experiments/search_review/**
      - tests/fixtures/tRNA5.sto
      - seqlib/stockholm.py
      - .github/workflows/search-review.yml
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the pinned model catalog and download verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: myon-bioinformatics/TalkCompress
          ref: 2826357e2fd378438a1bb39c1513b8fe9ef757d7
          path: .talkcompress
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: latest
          python-version: "3.12"
          enable-cache: false
      - name: Fetch verified weights and run the CPU comparison
        run: |
          mkdir -p results
          python3 .talkcompress/scripts/ai_readability.py fetch minilm-l6-xnli-onnx --dest "$RUNNER_TEMP/judge"
          uv sync --project .talkcompress --locked --only-group judge
          .talkcompress/.venv/bin/python experiments/search_review/review.py --model-dir "$RUNNER_TEMP/judge" evaluate > results/ranking.json
          cp "$RUNNER_TEMP/judge/provenance.json" results/
          python3 -c 'import json; r=json.load(open("results/ranking.json")); print(json.dumps({n: {k: v[k] for k in ("metrics", "threshold_counts")} for n,v in (("synthetic", r), ("reference", r["reference"]))}, indent=2))'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-search-review
          path: results/
          if-no-files-found: error
