name: Pages

# Publishes the usage guide: docs/guide.page.json (a web-ui-page/1 spec, data only). The parent's reusable
# workflow renders it with the PySaiyanWeBoo commit pinned there — no HTML, CSS or JS lives in this repository.
# Pull requests build the page (an invalid spec fails there); only main deploys.
on:
  push:
    branches: [main]
    paths:
      - "docs/guide.page.json"
      - "docs/guide.features.json"
      - "docs/brand/**"
      - ".github/workflows/pages.yml"
      - "ssis.py"
      - "sequence_service.py"
      - "seqlib/**"
      - "protein/**"
      - "vendor/cli_args.py"
  pull_request:
    paths:
      - "docs/guide.page.json"
      - "docs/guide.features.json"
      - "docs/brand/**"
      - ".github/workflows/pages.yml"
      - "ssis.py"
      - "sequence_service.py"
      - "seqlib/**"
      - "protein/**"
      - "vendor/cli_args.py"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-pages-static.yml@0361d4d81add261ba15073fc32f2a524d2b7e2de
    with:
      artifact_path: _site
      guide_page: docs/guide.page.json
      guide_features_config: docs/guide.features.json
      guide_brand: search_seq_including_spaces   # ♻️ icon and favicon from CaChereCyCle (search_seq_including_spaces.icon / search_seq_including_spaces.favicon)
