[project]
name = "search-seq-including-spaces-dev"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1.1"]

# Vendored/source runtime has no dependencies. uv manages contributor tools only.
[tool.uv]
package = false
environments = ["python_version >= '3.11'"]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.11" }

# `uv run pytest` starts the pytest script, which does not put the working
# directory on sys.path. Keep the repository root importable for the flat layout.
[tool.pytest.ini_options]
pythonpath = ["."]
